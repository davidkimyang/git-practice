<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e53e3e" />
    <meta name="description" content="웨이터나라 - 웨이터 전문 구인구직 & 커뮤니티" />
    <title>웨이터나라 - 웨이터 전문 구인구직</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <style>
      :root { --primary: #e53e3e; --primary-dark: #c53030; }
      * { box-sizing: border-box; }
      body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      .btn-primary { background-color: #e53e3e; color: white; }
      .btn-primary:hover { background-color: #c53030; }
      .text-primary { color: #e53e3e; }
      .border-primary { border-color: #e53e3e; }
      .bg-primary { background-color: #e53e3e; }
      .badge-premium { background: linear-gradient(135deg, #f6d365, #fda085); }
      .badge-special { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
      .badge-regular { background: #e2e8f0; color: #4a5568; }
      .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
  </head>
  <body>
    <noscript>이 앱을 실행하려면 JavaScript가 필요합니다.</noscript>
    <div id="root"></div>
  </body>
</html>
