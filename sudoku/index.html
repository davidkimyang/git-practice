<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스도쿠</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>스도쿠</h1>

    <div class="controls">
      <div class="difficulty">
        <label>난이도:</label>
        <button class="diff-btn active" data-level="easy">쉬움</button>
        <button class="diff-btn" data-level="medium">보통</button>
        <button class="diff-btn" data-level="hard">어려움</button>
      </div>
      <div class="timer" id="timer">00:00</div>
    </div>

    <div class="board" id="board"></div>

    <div class="numpad">
      <button class="num-btn" data-num="1">1</button>
      <button class="num-btn" data-num="2">2</button>
      <button class="num-btn" data-num="3">3</button>
      <button class="num-btn" data-num="4">4</button>
      <button class="num-btn" data-num="5">5</button>
      <button class="num-btn" data-num="6">6</button>
      <button class="num-btn" data-num="7">7</button>
      <button class="num-btn" data-num="8">8</button>
      <button class="num-btn" data-num="9">9</button>
      <button class="num-btn erase-btn" data-num="0">지우기</button>
    </div>

    <div class="action-btns">
      <button id="new-game-btn">새 게임</button>
      <button id="hint-btn">힌트 (<span id="hint-count">3</span>)</button>
      <button id="check-btn">검사</button>
    </div>

    <div id="message" class="message hidden"></div>
  </div>

  <script src="sudoku.js"></script>
</body>
</html>
