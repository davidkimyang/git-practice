<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Snake</h1>
    <div class="score-board">
      <span>점수: <strong id="score">0</strong></span>
      <span>최고: <strong id="high-score">0</strong></span>
    </div>
    <div class="game-wrapper">
      <canvas id="game-canvas" width="400" height="400"></canvas>
      <div id="overlay" class="overlay">
        <div class="overlay-content">
          <p id="overlay-message">준비됐나요?</p>
          <button id="start-btn">시작하기</button>
        </div>
      </div>
    </div>
    <p class="hint">방향키 또는 WASD로 조작</p>
    <div class="mobile-controls">
      <div class="ctrl-row">
        <button class="ctrl-btn" id="btn-up" aria-label="위">▲</button>
      </div>
      <div class="ctrl-row">
        <button class="ctrl-btn" id="btn-left" aria-label="왼쪽">◀</button>
        <button class="ctrl-btn" id="btn-down" aria-label="아래">▼</button>
        <button class="ctrl-btn" id="btn-right" aria-label="오른쪽">▶</button>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
