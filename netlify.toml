# Netlify 빌드 설정
# transit-app (Expo Web) 배포

[build]
  base    = "transit-app"
  command = "npm install && npx expo export --platform web"
  publish = "transit-app/dist"

[build.environment]
  NODE_VERSION = "20"

# React Navigation / Expo Router SPA 라우팅 처리
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
